<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4e9">
  <meta name="description" content="Catalogo rapido di vini e birre del Piccolo Gatsby.">
  <title>CATALOGO | VINI Gatsby</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">✳</div>
      <h1>CATALOGO</h1>
      <div class="header-spacer" aria-hidden="true"></div>
    </header>

    <main>
      <nav class="main-tabs" aria-label="Tipo di catalogo">
        <button class="main-tab active" data-kind="vini" type="button">🍷 Vini <span id="wine-count">65</span></button>
        <button class="main-tab" data-kind="birre" type="button">🍺 Birre <span id="beer-count">0</span></button>
      </nav>

      <section id="wine-view" class="catalog-view">
        <div class="category-strip" id="category-strip" aria-label="Filtra per tipologia">
          <button class="category-chip active" data-category="Tutti" type="button">Tutti i vini</button>
          <button class="category-chip white" data-category="Bianchi" type="button">Bianchi</button>
          <button class="category-chip red" data-category="Rossi" type="button">Rossi</button>
          <button class="category-chip rose" data-category="Rosati" type="button">Rosati</button>
          <button class="category-chip bubbles" data-category="Bollicine" type="button">Bollicine</button>
          <button class="category-chip sweet" data-category="Dolci" type="button">Dolci</button>
        </div>

        <div class="toolbar">
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="search" type="search" placeholder="Cerca vino, cantina, vitigno…" autocomplete="off" aria-label="Cerca nel catalogo">
            <button id="clear-search" class="clear-search" type="button" aria-label="Cancella ricerca" hidden>×</button>
          </label>
          <label class="sort-box"><span>Ordina per</span>
            <select id="sort-select" aria-label="Ordina vini">
              <option value="nome">Nome (A–Z)</option>
              <option value="colore">Colore</option>
              <option value="cantina">Cantina / Produttore (A–Z)</option>
              <option value="annata">Annata (crescente)</option>
              <option value="denominazione">Denominazione (A–Z)</option>
              <option value="regione">Regione (A–Z)</option>
              <option value="zona">Zona (A–Z)</option>
              <option value="vitigni">Vitigni + percentuali (A–Z)</option>
              <option value="gradazione">Gradazione (crescente)</option>
              <option value="metodo">Metodo di produzione</option>
            </select>
          </label>
        </div>

        <div class="results-line"><span id="results-count">65 vini</span><span class="results-hint">Tocca una scheda per aprirla</span></div>
        <div id="wine-grid" class="wine-grid" aria-live="polite"></div>
        <div id="empty-state" class="empty-state" hidden><span class="empty-icon">🍇</span><h2>Nessun vino trovato</h2><p>Prova a cambiare ricerca o categoria.</p><button id="reset-filters" type="button" class="reset-button">Azzera filtri</button></div>
      </section>

      <section id="beer-view" class="empty-catalog" hidden>
        <div class="empty-illustration">🍺</div>
        <h2>Catalogo birre</h2>
        <p>Le schede delle birre compariranno qui quando verrà aggiunto il relativo database.</p>
      </section>
    </main>
    <footer class="footer"><span>VINI GATSBY</span><span id="data-version">DATABASE · VERSIONE 01</span></footer>
  </div>

  <div id="detail-overlay" class="detail-overlay" hidden>
    <button class="overlay-backdrop" type="button" aria-label="Chiudi scheda"></button>
    <article id="detail-panel" class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-name" tabindex="-1">
      <button id="close-detail" class="close-detail" type="button" aria-label="Chiudi scheda">×</button>
      <div id="detail-content"></div>
    </article>
  </div>
  <div id="app-error" class="app-error" hidden></div>
  <script src="app.js"></script>
</body>
</html>
